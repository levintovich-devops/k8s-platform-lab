#cloud-config

apt:
  sources_list: |
    Types: deb
    URIs: https://eu-north-1.ec2.archive.ubuntu.com/ubuntu/
    Suites: noble noble-updates noble-backports
    Components: main universe restricted multiverse
    Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

    Types: deb
    URIs: https://security.ubuntu.com/ubuntu
    Suites: noble-security
    Components: main universe restricted multiverse
    Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

package_update: true
package_upgrade: false

packages:
  - unzip
  
runcmd:
  # AWS CLI v2
  - curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
  - unzip -q /tmp/awscliv2.zip -d /tmp
  - /tmp/aws/install

  # kubectl
  - curl -fsSL https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
  - chmod 755 /usr/local/bin/kubectl

  # Helm
  - curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
  - tar -xzf /tmp/helm.tar.gz -C /tmp
  - install -m 755 /tmp/linux-amd64/helm /usr/local/bin/helm