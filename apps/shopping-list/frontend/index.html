<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping List</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <header>
        <p class="eyebrow">NETWORK LAB</p>
        <h1>Shopping list</h1>
        <p class="subtitle">Keep track of what you need.</p>
      </header>
      <form id="item-form">
        <label for="item-name">Item name</label>
        <input id="item-name" name="name" maxlength="120" placeholder="e.g. Apples" required>
        <div class="form-row">
          <div>
            <label for="item-quantity">Quantity</label>
            <input id="item-quantity" name="quantity" type="number" min="1" max="100000" value="1" required>
          </div>
          <button type="submit">Add item</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="items" aria-label="Shopping list items"></ul>
    </main>
  </body>
</html>
