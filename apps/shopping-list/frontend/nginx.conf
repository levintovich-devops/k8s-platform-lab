server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
