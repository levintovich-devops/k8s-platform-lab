---
- name: Create kubeadm configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write kubeadm initialization configuration
  ansible.builtin.copy:
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: "{{ control_plane_ip }}"
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: "{{ kubernetes_version }}"
      networking:
        podSubnet: "{{ kubernetes_pod_cidr }}"
  register: kubeadm_config

- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_config

- name: Initialize the Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_config.stat.exists

- name: Wait for the Kubernetes API server to become ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: api_ready
  changed_when: false
  retries: 60
  delay: 5
  until: api_ready.rc == 0

- name: Check whether the worker has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  delegate_to: worker
  register: worker_join_status

- name: Generate a worker join command only when needed
  ansible.builtin.command:
    argv: [kubeadm, token, create, --print-join-command]
  register: worker_join_command
  when: not worker_join_status.stat.exists
  no_log: true

- name: Create kubeconfig directory for the Vagrant user
  ansible.builtin.file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0700"

- name: Install kubeconfig for the Vagrant user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: "0600"

- name: Create shared output directory for host kubeconfig
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../.vagrant"
    state: directory
    mode: "0700"

- name: Copy host-accessible kubeconfig to the shared project folder
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    remote_src: true
    dest: "{{ playbook_dir }}/../.vagrant/kubeconfig"
    owner: vagrant
    group: vagrant
    mode: "0600"
