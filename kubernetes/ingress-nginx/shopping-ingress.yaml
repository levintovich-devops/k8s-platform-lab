apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopping
  namespace: network-lab
spec:
  ingressClassName: nginx
  rules:
    - host: shopping.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80